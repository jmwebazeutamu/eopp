# Apache vhost for the EOPP application.
#
# The server already terminates TLS in Apache on 80/443 and proxies to
# per-application ports on the loopback — sris, grm and rentals all work this
# way. This follows that shape rather than taking 80/443 for Traefik, which
# would disturb every other site on the box.
#
# Install:
#   sudo cp eopp.johnsonmwebaze.info.conf /etc/apache2/sites-available/
#   sudo a2ensite eopp.johnsonmwebaze.info && sudo systemctl reload apache2
#   sudo certbot --apache -d eopp.johnsonmwebaze.info
#
# certbot writes the :443 companion itself, matching the -le-ssl.conf files
# already on the host.

<VirtualHost *:80>
    ServerName eopp.johnsonmwebaze.info

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8007/
    ProxyPassReverse / http://127.0.0.1:8007/

    # Django reads X-Forwarded-Proto through SECURE_PROXY_SSL_HEADER. Without
    # it, production.py's SECURE_SSL_REDIRECT sees plain HTTP behind the proxy
    # and redirects forever.
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

    ErrorLog ${APACHE_LOG_DIR}/eopp_error.log
    CustomLog ${APACHE_LOG_DIR}/eopp_access.log combined
</VirtualHost>
