#cloud-config
# Provisions an engineer's development VM — spec §2.1.
#
# Every engineer develops inside an identical Ubuntu VM regardless of host OS,
# running the same Compose stack as staging and production.
#
#   multipass launch --name yep-dev --cpus 4 --memory 8G --disk 40G \
#     --cloud-init infra/multipass/cloud-init.yaml 22.04

package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - git
  - make
  - postgresql-client
  - python3-pip

runcmd:
  # Docker CE from Docker's own repository — the archive packages lag far enough
  # behind that Compose file features used here are missing.
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable"
    > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker ubuntu
  - systemctl enable --now docker

final_message: |
  yep-dev ready. Next:
    multipass mount . yep-dev:/home/ubuntu/youth-employment-platform
    multipass shell yep-dev
    cd youth-employment-platform && ./scripts/bootstrap.sh
