# EEPP — base stack (spec §2).
#
# This file describes the deployed shape: Traefik in front, Django + Celery,
# Postgres, Redis, MinIO. It carries NO development defaults. Every secret uses
# the ${VAR:?message} form, so a missing variable stops the stack instead of
# silently falling back to a committed placeholder.
#
#   dev:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   prod: docker compose -f docker-compose.yml up -d
#
# Host ports are registered in ~/PORTS.md: 8007 web, 8008 MinIO console,
# 5407 Postgres, 6307 Redis.

name: yep

# Only `web` carries a build block. celery and celery-beat run the same image and
# reference it by tag: three services building one tag makes buildx race on the
# export step and fail with "image already exists". Compose completes the build
# phase before creating any container, so the tag is present locally by the time
# the Celery services start.
x-django-env: &django-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set in infra/.env}
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.production}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DB_NAME: ${DB_NAME:-yep}
  DB_USER: ${DB_USER:-yep}
  DB_PASSWORD: ${DB_PASSWORD:?set in infra/.env}
  DB_HOST: db
  DB_PORT: 5432
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  MINIO_ENDPOINT_URL: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set in infra/.env}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set in infra/.env}
  MINIO_BUCKET: ${MINIO_BUCKET:-yep-media}

services:
  traefik:
    # v3.6+: earlier v3.x pin their embedded Docker client to API v1.24, which
    # Docker 29 rejects outright ("minimum supported API version is 1.44"). The
    # provider then never connects and every route returns 404.
    image: traefik:v3.6
    container_name: yep_traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --log.level=INFO
    environment:
      # Traefik's embedded Docker client negotiates from API v1.24, which Docker
      # 29 refuses ("client version 1.24 is too old, minimum is 1.44"). Without
      # this the provider never connects and every route 404s.
      DOCKER_API_VERSION: "1.44"
    ports:
      - "${TRAEFIK_HTTP_PORT:-8007}:80"
    volumes:
      # Read-only: Traefik only needs to discover containers, never to control them.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [yep]

  db:
    image: postgres:16
    container_name: yep_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-yep}
      POSTGRES_USER: ${DB_USER:-yep}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in infra/.env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-yep} -d ${DB_NAME:-yep}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [yep]

  redis:
    image: redis:7-alpine
    container_name: yep_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [yep]

  minio:
    image: minio/minio:latest
    container_name: yep_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in infra/.env}
    ports:
      - "${MINIO_CONSOLE_PORT:-8008}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [yep]

  # Creates the media bucket on first boot, then exits. Without this the first
  # file upload fails against a bucket that was never created.
  minio-init:
    image: minio/mc:latest
    container_name: yep_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in infra/.env}
      MINIO_BUCKET: ${MINIO_BUCKET:-yep-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET} &&
      mc anonymous set none local/$${MINIO_BUCKET} &&
      echo 'bucket ready'
      "
    networks: [yep]

  web:
    build:
      context: ../backend
      args:
        REQUIREMENTS: ${BACKEND_REQUIREMENTS:-production}
    image: yep-backend:${IMAGE_TAG:-latest}
    container_name: yep_web
    restart: unless-stopped
    environment: *django-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.yep-web.rule=PathPrefix(`/`)
      - traefik.http.routers.yep-web.entrypoints=web
      - traefik.http.services.yep-web.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks: [yep]

  celery:
    image: yep-backend:${IMAGE_TAG:-latest}
    container_name: yep_celery
    restart: unless-stopped
    command: celery -A config worker -l info -Q default
    environment: *django-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [yep]

  celery-beat:
    image: yep-backend:${IMAGE_TAG:-latest}
    container_name: yep_celery_beat
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment: *django-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [yep]

  # metabase: added in Sprint 7 (spec §8) against a read-only Postgres role,
  # published on host port 8009.

volumes:
  db_data:
  redis_data:
  minio_data:

networks:
  yep:
    driver: bridge
