name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  DJANGO_SETTINGS_MODULE: config.settings.development

jobs:
  backend:
    name: Backend — lint, migrations, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: yep_test
          POSTGRES_USER: yep
          POSTGRES_PASSWORD: ci-not-a-secret
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["6379:6379"]

    env:
      DJANGO_SECRET_KEY: ci-only-key-not-used-in-any-deployment
      DB_NAME: yep_test
      DB_USER: yep
      DB_PASSWORD: ci-not-a-secret
      DB_HOST: localhost
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/development.txt

      - name: Lint
        run: |
          black --check .
          isort --check-only .
          flake8 .

      - name: Django system checks
        run: python manage.py check --fail-level WARNING

      - name: Detect missing migrations
        # A model change merged without its migration breaks the next deploy,
        # so this fails the build rather than warning.
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest --cov=apps --cov-report=term-missing

  image:
    name: Backend image builds
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          build-args: REQUIREMENTS=production
          cache-from: type=gha
          cache-to: type=gha,mode=max
