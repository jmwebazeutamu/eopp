[flake8]
max-line-length = 120
exclude = .git,__pycache__,migrations,staticfiles,.venv
# E203 disagrees with black on slice whitespace; W503 predates the line-break style black uses.
extend-ignore = E203,W503
per-file-ignores =
    config/settings/development.py:F401,F403
    config/settings/production.py:F401,F403
