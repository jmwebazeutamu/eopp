# Serves the built client.
#
# Traefik sends only the paths Django does not own; everything arriving here is
# a client route or a built asset.

server {
    listen 80;
    # IPv6 too: `localhost` resolves to ::1 first in this image, so an
    # IPv4-only listener answers "connection refused" to anything that uses the
    # name — including a healthcheck.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed filenames, so these can be cached hard and for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other path is a client route. Serving index.html for them is what
    # makes a deep link work — /cases/<uuid> is resolved by the router in the
    # browser, and the server has never heard of it.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html itself must never be cached: it names the hashed bundles,
        # so a stale copy points at assets that no longer exist after a deploy.
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
